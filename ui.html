<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerminalVox</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --text: #1d1c1a; --muted: #6f6c66; --line: #dedbd4;
    --accent: #c4622d; --accent-text: #fff; --busy: #b7791f; --warn: #b42318; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #22211e; --text: #ecebe7; --muted: #9a968e; --line: #36342f;
      --accent: #e07a43; --accent-text: #171614; --busy: #e0a84b; --warn: #f0705f; --ok: #5cb984;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 20px; font-weight: 600; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .combo { position: relative; }
  .combo input {
    width: 100%; padding: 12px 14px; font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .combo input:focus { border-color: var(--accent); }
  .list {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px);
    max-height: 55vh; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
    display: none;
  }
  .list.open { display: block; }
  .item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .item:hover, .item.hl { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .item.sel .name::after { content: " ✓"; color: var(--accent); }
  .name { font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; font-weight: 500; margin-left: 6px; }
  .badge.busy { color: var(--busy); }
  .badge.waiting { color: var(--warn); }
  .empty { padding: 12px 14px; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: center; margin: 18px 0 22px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .check small { display: block; color: var(--muted); font-size: 13px; }
  button {
    width: 100%; padding: 14px; font: inherit; font-weight: 600; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.stop { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 16px; font-size: 14px; color: var(--muted); min-height: 1.4em; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--warn); }
  .hint { margin-top: 28px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>TerminalVox</h1>

  <label class="field" for="search">Session</label>
  <div class="combo">
    <input id="search" type="text" autocomplete="off" placeholder="Search by name or folder">
    <div id="list" class="list" role="listbox"></div>
  </div>

  <label class="check">
    <input id="inject" type="checkbox" checked>
    <span>Inject voice mode messages
      <small>"voice mode is on" on connect, "off" when switching to another session</small></span>
  </label>

  <label class="check">
    <span>Speech pace
      <small>how long to wait for the rest of a phrase after a pause</small></span>
    <select id="pace">
      <option value="fast">fast</option>
      <option value="normal" selected>normal</option>
      <option value="slow">with pauses</option>
    </select>
  </label>

  <button id="connect">Connect</button>
  <button id="photo" class="stop" style="margin-top: 10px" hidden>Send photo</button>
  <input id="photofile" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
  <div id="status"></div>
  <audio id="audio" autoplay playsinline></audio>

  <p class="hint">Use headphones. Say "stop" to interrupt a reply, "bye" to end the call.
    You can switch sessions during the call.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let sessions = [];
let selected = store.get("pane");  // tmux pane id, e.g. %64
let pc = null, mic = null, highlighted = -1;

if (store.get("inject") === "0") $("inject").checked = false;
$("inject").onchange = () => store.set("inject", $("inject").checked ? "1" : "0");
if (store.get("pace")) $("pace").value = store.get("pace");
$("pace").onchange = () => store.set("pace", $("pace").value);

function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}

function current() { return sessions.find((s) => s.pane === selected); }

function setStatus(text, cls = "") { $("status").textContent = text; $("status").className = cls; }

function render() {
  const q = $("search").value.trim().toLowerCase();
  const cur = current();
  // While the field has focus and its text equals the selected session, show everything.
  const showAll = cur && $("search").value === cur.name;
  const items = sessions.filter((s) => showAll || !q ||
    [s.name, s.where, s.cwd].some((v) => v.toLowerCase().includes(q)));
  highlighted = Math.min(highlighted, items.length - 1);
  $("list").innerHTML = items.length ? "" : '<div class="empty">Nothing found</div>';
  items.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "item" + (s.pane === selected ? " sel" : "") + (i === highlighted ? " hl" : "");
    el.setAttribute("role", "option");
    const badge = s.status === "busy" ? '<span class="badge busy">working</span>'
      : s.status === "waiting" ? '<span class="badge waiting">waiting for an answer in the terminal</span>' : "";
    el.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    el.querySelector(".name").textContent = s.name;
    el.querySelector(".name").insertAdjacentHTML("beforeend", badge);
    el.querySelector(".meta").textContent = `${ago(s.updatedAt)} · ${s.where} · ${s.cwd}`;
    el.onmousedown = (e) => { e.preventDefault(); choose(s); };
    $("list").appendChild(el);
  });
  return items;
}

async function load() {
  try {
    const r = await fetch("/api/sessions");
    sessions = (await r.json()).sessions;
  } catch { return; }
  if (!current()) selected = (sessions.find((s) => s.name === "voice") || sessions[0] || {}).pane;
  if (document.activeElement !== $("search") && current()) $("search").value = current().name;
  if ($("list").classList.contains("open")) render();
}

async function choose(s) {
  const changed = s.pane !== selected;
  selected = s.pane;
  store.set("pane", selected);
  $("search").value = s.name;
  $("list").classList.remove("open");
  $("search").blur();
  if (changed && pc) {
    setStatus(`Switching to ${s.name}…`);
    const r = await fetch("/api/switch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pane: s.pane, inject: $("inject").checked }),
    });
    setStatus(r.ok ? `Talking to ${s.name}` : `Could not switch: ${(await r.json()).detail}`,
      r.ok ? "ok" : "err");
  }
}

$("search").onfocus = () => { $("search").select(); highlighted = -1; load(); render(); $("list").classList.add("open"); };
$("search").oninput = () => { highlighted = 0; render(); $("list").classList.add("open"); };
$("search").onblur = () => {
  $("list").classList.remove("open");
  if (current()) $("search").value = current().name;
};
$("search").onkeydown = (e) => {
  const items = render();
  if (e.key === "ArrowDown") { highlighted = Math.min(highlighted + 1, items.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { highlighted = Math.max(highlighted - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "Enter" && items[Math.max(highlighted, 0)]) choose(items[Math.max(highlighted, 0)]);
  else if (e.key === "Escape") $("search").blur();
};

function iceDone(conn, ms = 2000) {
  // Send the offer with all candidates at once, no trickle ICE.
  return new Promise((resolve) => {
    if (conn.iceGatheringState === "complete") return resolve();
    const t = setTimeout(resolve, ms);
    conn.addEventListener("icegatheringstatechange", () => {
      if (conn.iceGatheringState === "complete") { clearTimeout(t); resolve(); }
    });
  });
}

let quota = false; // a quota error is shown: later generic errors must not overwrite it

async function connect() {
  $("connect").disabled = true;
  setStatus("Connecting…");
  try {
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    pc = new RTCPeerConnection();
    mic.getTracks().forEach((t) => pc.addTrack(t, mic));
    // Bot errors (RTVI error) arrive over the data channel: an ElevenLabs quota error is shown explicitly.
    pc.createDataChannel("chat").onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.type !== "error") return;
      const text = m.data?.error || "";
      if (/quota|exceeded/i.test(text)) quota = true;
      setStatus(quota ? "ElevenLabs quota exhausted: check your plan at elevenlabs.io" : `Error: ${text}`, "err");
    };
    quota = false;
    pc.ontrack = (e) => {
      $("audio").srcObject = e.streams[0] || new MediaStream([e.track]);
      $("audio").play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      const st = pc && pc.connectionState;
      if (st === "connected") {
        setStatus(`Talking to ${current() ? current().name : "the session"}`, "ok");
        $("photo").hidden = false;
      }
      if (st === "failed" || st === "closed" || st === "disconnected") disconnect(st === "failed" ? "Connection lost" : "");
    };
    await pc.setLocalDescription(await pc.createOffer());
    await iceDone(pc);
    const r = await fetch("/api/offer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sdp: pc.localDescription.sdp, type: "offer",
        request_data: { pane: selected, inject: $("inject").checked, pace: $("pace").value },
      }),
    });
    if (!r.ok) throw new Error(`server responded ${r.status}`);
    await pc.setRemoteDescription(await r.json());
    $("connect").textContent = "Disconnect";
    $("connect").className = "stop";
  } catch (e) {
    disconnect(`Could not connect: ${e.message || e}`);
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(msg = "") {
  if (pc) { const p = pc; pc = null; p.close(); }
  if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
  $("connect").textContent = "Connect";
  $("connect").className = "";
  $("photo").hidden = true;
  setStatus(msg, msg ? "err" : "");
}

$("connect").onclick = () => (pc ? disconnect() : connect());

// A photo into the call: without a caption the server attaches it to the next phrase.
$("photo").onclick = () => $("photofile").click();
$("photofile").onchange = async () => {
  const f = $("photofile").files[0];
  $("photofile").value = "";
  if (!f) return;
  const form = new FormData();
  form.append("file", f);
  const r = await fetch("/api/image", { method: "POST", body: form }).catch(() => null);
  if (!r || !r.ok) setStatus(`Photo not sent: ${r ? (await r.json().catch(() => ({}))).detail || r.status : "network"}`, "err");
};
load();
setInterval(() => { if (!$("list").classList.contains("open")) load(); }, 15000);
</script>
</body>
</html>
